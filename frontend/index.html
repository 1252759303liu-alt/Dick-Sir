<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教科书阅读助手 - Textbook Reading Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-book"></i> 教科书阅读助手
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#upload-section">上传</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#chapters-section">章节</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#qa-section">问答</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Upload Section -->
        <section id="upload-section" class="mb-5">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-cloud-upload"></i> 文件上传</h5>
                </div>
                <div class="card-body">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="bi bi-cloud-arrow-up"></i>
                        </div>
                        <p class="upload-text">拖拽文件到此处或点击选择文件</p>
                        <p class="upload-info">支持 PDF、JPG、PNG 格式，最大 50MB</p>
                        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" hidden>
                        <button class="btn btn-primary" id="selectFileBtn">
                            <i class="bi bi-file-earmark-plus"></i> 选择文件
                        </button>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div id="progressContainer" class="mt-3" style="display: none;">
                        <div class="progress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" 
                                 id="uploadProgress" 
                                 style="width: 0%">
                            </div>
                        </div>
                        <p class="text-center mt-2" id="progressText">上传中...</p>
                    </div>
                    
                    <!-- File Info -->
                    <div id="fileInfo" class="mt-3" style="display: none;">
                        <div class="alert alert-success">
                            <h6><i class="bi bi-check-circle"></i> 文件上传成功</h6>
                            <p class="mb-0" id="fileDetails"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Chapters Section -->
        <section id="chapters-section" class="mb-5" style="display: none;">
            <div class="row">
                <!-- Chapter Tree -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0"><i class="bi bi-list-nested"></i> 章节目录</h5>
                        </div>
                        <div class="card-body" id="chapterTree">
                            <p class="text-muted">加载中...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Display -->
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="bi bi-file-text"></i> 内容展示</h5>
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-sm btn-light" id="showOriginalBtn">原文</button>
                                    <button type="button" class="btn btn-sm btn-light" id="showSummaryBtn">总结</button>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <!-- Original Content -->
                            <div id="originalContent">
                                <p class="text-muted">请选择一个章节查看内容</p>
                            </div>
                            
                            <!-- Summary Content -->
                            <div id="summaryContent" style="display: none;">
                                <div class="text-center">
                                    <button class="btn btn-primary" id="generateSummaryBtn">
                                        <i class="bi bi-stars"></i> 生成AI总结
                                    </button>
                                </div>
                                <div id="summaryText" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Q&A Section -->
        <section id="qa-section" class="mb-5" style="display: none;">
            <div class="card">
                <div class="card-header bg-warning">
                    <h5 class="mb-0"><i class="bi bi-question-circle"></i> 智能问答</h5>
                </div>
                <div class="card-body">
                    <!-- Chapter Selector -->
                    <div class="mb-3">
                        <label for="qaChapterSelect" class="form-label">选择章节（可选）</label>
                        <select class="form-select" id="qaChapterSelect">
                            <option value="">全部内容</option>
                        </select>
                    </div>
                    
                    <!-- Question Input -->
                    <div class="mb-3">
                        <label for="questionInput" class="form-label">提问</label>
                        <textarea class="form-control" id="questionInput" rows="3" 
                                  placeholder="请输入您的问题..."></textarea>
                    </div>
                    
                    <button class="btn btn-primary" id="askQuestionBtn">
                        <i class="bi bi-send"></i> 提问
                    </button>
                    
                    <!-- Conversation History -->
                    <div id="conversationHistory" class="mt-4">
                        <h6>对话历史</h6>
                        <div id="historyContent"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Loading Modal -->
    <div class="modal" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p id="loadingText">处理中，请稍候...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
